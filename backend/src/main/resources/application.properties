spring.application.name=notes-api

# Runs with "dev" unless SPRING_PROFILES_ACTIVE says otherwise (OpenShift sets "prod")
spring.profiles.default=dev

# Fine for a warm-up; project A should switch to Flyway migrations and ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Probes: /actuator/health/liveness and /actuator/health/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Let in-flight requests finish when OpenShift stops a pod
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
